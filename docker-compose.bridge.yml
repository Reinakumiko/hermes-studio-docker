# bridge 架构部署（单容器版）：hermes-studio 镜像内置 bridge
#
# 前提：你的 hermes 机器上跑着 `hermes serve --host 0.0.0.0`（暴露 /api/ws）
#
# 用法：
#   1. 修改 HERMES_GATEWAY_WS / HERMES_GATEWAY_TOKEN（或写入同目录 .env）
#   2. WEBUI_IMAGE 改成你的 GHCR 镜像
#   3. docker compose -f docker-compose.bridge.yml up -d
services:
  hermes-webui:
    image: ${WEBUI_IMAGE:-ghcr.io/CHANGE-ME/hermes-studio-docker:latest}
    container_name: ${WEBUI_CONTAINER_NAME:-hermes-webui}
    ports:
      - "${PORT:-6060}:${PORT:-6060}"
      - "${PREVIEW_FRONTEND_PORT:-8651}:8651"
      - "${XAI_OAUTH_PORT:-56121}:56121"
    volumes:
      - ${HERMES_DATA_DIR:-./hermes_data}:/home/agent/.hermes
      - ${HERMES_DATA_DIR:-./hermes_data}/hermes-web-ui:/home/agent/.hermes-web-ui
    environment:
      - PORT=${PORT:-6060}
      - HERMES_HOME=/home/agent/.hermes
      # bridge 模式开关：设了即启用内置 bridge（入口脚本自动拉起并注入
      # HERMES_AGENT_BRIDGE_ENDPOINT=tcp://127.0.0.1:18765）
      - BRIDGE_GATEWAY_URL=${HERMES_GATEWAY_WS:-ws://host.docker.internal:9119/api/ws}
      - BRIDGE_GATEWAY_TOKEN=${HERMES_GATEWAY_TOKEN:-}
      - HERMES_WEB_UI_AUTH_JWT_EXPIRES_IN=${HERMES_WEB_UI_AUTH_JWT_EXPIRES_IN:-30d}
      - HERMES_LAN_ADVERTISE_URL=${HERMES_LAN_ADVERTISE_URL:-}
    restart: unless-stopped
    stdin_open: true
    tty: true