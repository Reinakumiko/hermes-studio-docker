# 运行自建干净镜像的 compose（不含 hermes agent）
# 用法：
#   WEBUI_IMAGE=ghcr.io/<你的用户名>/<你的仓库名>:latest docker compose up -d
# 或直接把下面 image: 的默认值改成你的镜像地址。
services:
  hermes-webui:
    image: ${WEBUI_IMAGE:-ghcr.io/CHANGE-ME/hermes-studio:latest}
    container_name: ${WEBUI_CONTAINER_NAME:-hermes-webui}
    ports:
      - "${PORT:-6060}:${PORT:-6060}"
      - "${PREVIEW_FRONTEND_PORT:-8651}:8651"
      - "${XAI_OAUTH_PORT:-56121}:56121"
    volumes:
      - ${HERMES_DATA_DIR:-./hermes_data}:/home/agent/.hermes
      - ${HERMES_DATA_DIR:-./hermes_data}/hermes-web-ui:/home/agent/.hermes-web-ui
    environment:
      - PORT=${PORT:-6060}
      - HERMES_HOME=/home/agent/.hermes
      - HERMES_WEB_UI_AUTH_JWT_EXPIRES_IN=${HERMES_WEB_UI_AUTH_JWT_EXPIRES_IN:-30d}
      - HERMES_WEB_UI_XAI_CALLBACK_BIND_HOST=0.0.0.0
      - HERMES_PATCH_SCRIPT=${HERMES_PATCH_SCRIPT:-}
      - HERMES_LAN_ADVERTISE_URL=${HERMES_LAN_ADVERTISE_URL:-}
      # 干净镜像没有内置 agent。若你有外部 hermes CLI，可挂载并指定路径：
      # - HERMES_BIN=/path/to/hermes
      # 否则 web UI 以无 agent 模式运行（聊天/agent 功能降级，管理界面正常）。
      - NPM_CONFIG_PREFIX=/home/agent/.hermes-web-ui/coding-agent/npm
      - PATH=/home/agent/.hermes-web-ui/coding-agent/npm/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    restart: unless-stopped
    stdin_open: true
    tty: true